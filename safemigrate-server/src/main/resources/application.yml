server:
  port: 8080

spring:
  application:
    name: safemigrate-server

safemigrate:
  target-db:
    url: jdbc:postgresql://localhost:5432/safemigrate_test
    username: postgres
    password: password
  kafka:
    bootstrap-servers: localhost:9092
  redis:
    address: redis://localhost:6380
  migration:
    default-batch-size: 100
    default-throttle-delay-ms: 10
    max-lock-timeout-ms: 2000
    approval-required: false
