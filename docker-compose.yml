name: safemigrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: safemigrate_postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: safemigrate_test
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safemigrate_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: safemigrate_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L622nShTKiAlbAZKNbxkw"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"

  redis:
    image: redis:7-alpine
    container_name: safemigrate_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./safemigrate-server
      dockerfile: Dockerfile
    container_name: safemigrate_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      SAFEMIGRATE_TARGET_DB_URL: jdbc:postgresql://postgres:5432/safemigrate_test
      SAFEMIGRATE_TARGET_DB_USERNAME: postgres
      SAFEMIGRATE_TARGET_DB_PASSWORD: password
      SAFEMIGRATE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SAFEMIGRATE_REDIS_ADDRESS: redis://redis:6379
      SAFEMIGRATE_MIGRATION_APPROVAL_REQUIRED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./safemigrate-dashboard
      dockerfile: Dockerfile
    container_name: safemigrate_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_BACKEND_URL: http://server:8080/api/migrations
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/migrations
    depends_on:
      - server

  worker:
    build:
      context: ./safemigrate-core
      dockerfile: Dockerfile
    container_name: safemigrate_worker
    restart: unless-stopped
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/safemigrate_test
      DB_USER: postgres
      DB_PASS: password
      REDIS_URL: redis://redis:6379
      MIGRATION_ID: mig-docker-fleet-01
      SOURCE_TABLE: users
      SHADOW_TABLE: users_shadow
      PK_COLUMN: id
      COLUMNS: id,email,status,created_at
      BATCH_SIZE: "500"
      THROTTLE_MS: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
