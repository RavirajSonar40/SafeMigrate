name: Multi-Cloud CI/CD (AWS + Oracle)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Artifacts (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JARs with Maven
        run: mvn clean package -DskipTests

      - name: Upload Server JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: safemigrate-server/target/*.jar

      - name: Upload Worker JAR
        uses: actions/upload-artifact@v4
        with:
          name: worker-jar
          path: safemigrate-core/target/*-worker.jar

  deploy-aws:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check AWS Secrets Configured
        id: check_secrets
        run: |
          if [ -n "${{ secrets.AWS_HOST }}" ] && [ -n "${{ secrets.AWS_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Server JAR
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: safemigrate-server/target

      - name: Download Worker JAR
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: worker-jar
          path: safemigrate-core/target

      - name: Setup SSH
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload JARs to AWS EC2
        if: steps.check_secrets.outputs.configured == 'true'
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.AWS_HOST }} "mkdir -p ~/SafeMigrate/safemigrate-server/target ~/SafeMigrate/safemigrate-core/target"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa safemigrate-server/target/*.jar ubuntu@${{ secrets.AWS_HOST }}:~/SafeMigrate/safemigrate-server/target/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa safemigrate-core/target/*-worker.jar ubuntu@${{ secrets.AWS_HOST }}:~/SafeMigrate/safemigrate-core/target/

      - name: Update Code & Rebuild Docker Stack on AWS
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/SafeMigrate
            echo "==================================================" | tee -a deploy.log
            echo "🚀 [DEPLOY TRIGGERED] $(date -u)" | tee -a deploy.log
            echo "Pre-deploy commit: $(git rev-parse --short HEAD)" | tee -a deploy.log
            git pull origin main | tee -a deploy.log
            echo "Deployed commit: $(git rev-parse --short HEAD) - $(git log -1 --pretty=%B | head -n 1)" | tee -a deploy.log
            echo "GITHUB_CLIENT_ID=Ov23liQRA1aEwV0iPyLo" > .env
            echo "GITHUB_CLIENT_SECRET=9fbb6e739f3466b9f913e896745175ac0bb60668" >> .env
            echo "NEXT_PUBLIC_GITHUB_CLIENT_ID=Ov23liQRA1aEwV0iPyLo" >> .env
            echo "🔄 Rebuilding Docker Compose fleet..." | tee -a deploy.log
            docker compose up -d --build | tee -a deploy.log
            echo "✅ Deployment finished successfully at $(date -u)" | tee -a deploy.log
            docker compose ps | tee -a deploy.log
            echo "==================================================" | tee -a deploy.log

  deploy-oracle:
    name: Deploy to Oracle Cloud
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check Oracle Secrets Configured
        id: check_secrets
        run: |
          if [ -n "${{ secrets.ORACLE_HOST }}" ] && [ -n "${{ secrets.ORACLE_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Server JAR
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: safemigrate-server/target

      - name: Download Worker JAR
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: worker-jar
          path: safemigrate-core/target

      - name: Setup SSH
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload JARs to Oracle Cloud
        if: steps.check_secrets.outputs.configured == 'true'
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.ORACLE_HOST }} "mkdir -p ~/SafeMigrate/safemigrate-server/target ~/SafeMigrate/safemigrate-core/target"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa safemigrate-server/target/*.jar ubuntu@${{ secrets.ORACLE_HOST }}:~/SafeMigrate/safemigrate-server/target/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa safemigrate-core/target/*-worker.jar ubuntu@${{ secrets.ORACLE_HOST }}:~/SafeMigrate/safemigrate-core/target/

      - name: Update Code & Rebuild Docker Stack on Oracle
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/SafeMigrate
            echo "==================================================" | tee -a deploy.log
            echo "🚀 [ORACLE DEPLOY TRIGGERED] $(date -u)" | tee -a deploy.log
            echo "Pre-deploy commit: $(git rev-parse --short HEAD)" | tee -a deploy.log
            git pull origin main | tee -a deploy.log
            echo "Deployed commit: $(git rev-parse --short HEAD) - $(git log -1 --pretty=%B | head -n 1)" | tee -a deploy.log
            echo "GITHUB_CLIENT_ID=Ov23liQRA1aEwV0iPyLo" > .env
            echo "GITHUB_CLIENT_SECRET=9fbb6e739f3466b9f913e896745175ac0bb60668" >> .env
            echo "NEXT_PUBLIC_GITHUB_CLIENT_ID=Ov23liQRA1aEwV0iPyLo" >> .env
            echo "🔄 Rebuilding Docker Compose fleet on Oracle..." | tee -a deploy.log
            docker compose up -d --build | tee -a deploy.log
            echo "✅ Deployment finished successfully at $(date -u)" | tee -a deploy.log
            docker compose ps | tee -a deploy.log
            echo "==================================================" | tee -a deploy.log
